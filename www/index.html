<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor Serviços</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF e html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex flex-col min-h-screen">

    <!-- CABEÇALHO -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center z-10 shadow-md sticky top-0">
        <div class="flex items-center space-x-2">
            <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-bold flex items-center justify-center">
                <i class="fa-solid fa-bolt text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Gestor Serviços</h1>
                <p class="text-xs text-slate-400" id="header-subtitle">Painel de Documentos</p>
            </div>
        </div>
        <button onclick="mudarAba('menu')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (ABAS) -->
    <main class="flex-1 overflow-y-auto p-4 pb-32 space-y-4">
        
        <!-- ABA 0: MENU PRINCIPAL -->
        <div id="aba-menu" class="space-y-4 tab-content">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-md text-center space-y-2">
                <h2 class="text-base font-bold text-amber-400">Painel de Controle Geral</h2>
                <p class="text-xs text-slate-400">Escolha uma das opções abaixo para gerenciar seu negócio:</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="mudarAba('orcamento')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition shadow-lg">
                    <i class="fa-solid fa-file-invoice-dollar text-2xl text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-200">Documentos</span>
                </button>
                <button onclick="mudarAba('clientes')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition shadow-lg">
                    <i class="fa-solid fa-users text-2xl text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-200">Clientes Salvos</span>
                </button>
                <button onclick="mudarAba('agenda')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition shadow-lg">
                    <i class="fa-solid fa-calendar-days text-2xl text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-200">Agenda</span>
                </button>
                <button onclick="mudarAba('materiais')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition shadow-lg">
                    <i class="fa-solid fa-box-open text-2xl text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-200">Materiais</span>
                </button>
                <button onclick="mudarAba('mao-obra')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition shadow-lg">
                    <i class="fa-solid fa-user-gear text-2xl text-amber-400"></i>
                    <span class="text-xs font-semibold text-slate-200">Mão de Obra</span>
                </button>
                <button onclick="mudarAba('relatorio')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition shadow-lg">
                    <i class="fa-solid fa-chart-line text-2xl text-emerald-400"></i>
                    <span class="text-xs font-semibold text-slate-200">Serviços Feitos</span>
                </button>
            </div>
            <button onclick="mudarAba('config')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg">
                <i class="fa-solid fa-building text-amber-400"></i>
                <span class="text-xs font-semibold text-slate-200">Dados da Empresa & Ajustes</span>
            </button>
        </div>

        <!-- ABA 1: DOCUMENTOS -->
        <div id="aba-orcamento" class="space-y-4 tab-content hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-sm">
                <label class="text-xs text-slate-400 block mb-1 font-semibold uppercase">Tipo de Documento
